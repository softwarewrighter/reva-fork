# cargo-deny policy for the desktop app: the core's permissive list
# (../rust/deny.toml), plus MPL-2.0 for five named crates only.
#
#   cargo deny check licenses        (from desktop/; run by rust/scripts/license-check.sh)
#
# Why: everything this workspace builds is redistributed (CLI binary, wasm
# module, desktop app), and the project ships no GPL, LGPL or AGPL code.
# Any crate whose license is not on this list fails the check, including
# crates with no license metadata.  See docs/licenses.md.

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
]
confidence-threshold = 0.9
# The workspace has no dependencies yet; keep the list for the ones to come.
unused-allowed-license = "allow"

# Tauri's HTML handling (tauri-utils, wry) uses Servo's CSS crates, which are
# MPL-2.0: weak, per-file copyleft, not GPL-family.  Used unmodified, MPL-2.0
# only asks that their source stays available (it is, on crates.io) and that
# the notice ships with the app.  Allowed for these crates and nothing else,
# so a new MPL dependency is a decision, not an accident.  docs/licenses.md.
exceptions = [
    { crate = "cssparser", allow = ["MPL-2.0"] },
    { crate = "cssparser-macros", allow = ["MPL-2.0"] },
    { crate = "selectors", allow = ["MPL-2.0"] },
    { crate = "dtoa-short", allow = ["MPL-2.0"] },
    { crate = "option-ext", allow = ["MPL-2.0"] },
]

[licenses.private]
# Workspace crates (publish = false) are MIT, checked by review, not here.
ignore = true
