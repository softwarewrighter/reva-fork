[package]
name = "reva-ui-canvas2d"
description = "Paints an IUP canvas's CD display list (reva-cd) on an HTML canvas, for the page's TUI"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
reva-cd = { path = "../../../cd/crates/reva-cd" }
wasm-bindgen = "=0.2.129"
web-sys = { version = "0.3", features = ["CanvasRenderingContext2d", "HtmlCanvasElement"] }
