[package]
name = "reva-ui-web"
description = "The TUI in the web page: a Yew element drawing the grid, keys and clicks back"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
reva-ui-base = { path = "../../../ui/crates/reva-ui-base" }
reva-ui-layout = { path = "../../../ui-layout/crates/reva-ui-layout" }
reva-ui-mirror = { path = "../../../ui-grid/crates/reva-ui-mirror" }
reva-ui-grid = { path = "../../../ui-grid/crates/reva-ui-grid" }
reva-ui-paint = { path = "../../../ui-grid/crates/reva-ui-paint" }
reva-ui-canvas2d = { path = "../reva-ui-canvas2d" }
yew = { version = "0.23", features = ["csr"] }
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["ClipboardEvent", "DataTransfer", "DomRect", "Element", "HtmlElement", "KeyboardEvent", "MouseEvent", "Document", "Window", "NodeList", "HtmlCanvasElement", "Selection"] }
