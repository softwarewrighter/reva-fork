# Component ui-web: the TUI in the web page (and the desktop app, which
# shows the same page): a Yew element drawing reva-ui-grid's cells.
# One Cargo workspace per component (docs/code-metrics.md); the build
# output goes to the repository's target/ (.cargo/config.toml).
[workspace]
resolver = "2"
members = ["crates/reva-ui-web", "crates/reva-ui-canvas2d"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
authors = ["Reva development team"]
rust-version = "1.89"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
