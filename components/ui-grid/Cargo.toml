# Component ui-grid: the TUI everywhere: a renderer's copy of the ui model,
# painted into a grid of character cells (docs/ui-model.md).
# One Cargo workspace per component (docs/code-metrics.md); the build
# output goes to the repository's target/ (.cargo/config.toml).
[workspace]
resolver = "2"
members = ["crates/reva-ui-mirror", "crates/reva-ui-grid", "crates/reva-ui-paint"]

[workspace.package]
version = "2026.1101.1"
edition = "2024"
publish = false
license = "MIT"
authors = ["Reva development team"]
rust-version = "1.89"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
