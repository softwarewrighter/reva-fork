# Component cd: Tecgraf CD (CanvasDraw) for IUP canvases, as a display list
# (the virtual library reva-vlib-iup serves the cd* functions with it).
# One Cargo workspace per component (docs/code-metrics.md); the build
# output goes to the repository's target/ (.cargo/config.toml).
[workspace]
resolver = "2"
members = ["crates/reva-cd", "crates/reva-cd-list"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
authors = ["Reva development team"]
rust-version = "1.89"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
