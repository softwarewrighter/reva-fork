# Component iup: the virtual library iup over the ui model, and a scripted
# headless UI host (docs/ui-model.md).
# One Cargo workspace per component (docs/code-metrics.md); the build
# output goes to the repository's target/ (.cargo/config.toml).
[workspace]
resolver = "2"
members = ["crates/reva-vlib-iup", "crates/reva-ui-script", "crates/reva-ui-term"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"
authors = ["Reva development team"]
rust-version = "1.89"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
