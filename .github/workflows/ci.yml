# The gate (scripts/check.sh) on Linux, macOS and Windows, then the
# desktop app's smoke test (components/desktop/smoke.sh) on each.
# Windows runs everything in Git Bash, as docs/packaging.md says.
name: ci

on:
  push:
    branches: [dev, main, "feat/**"]
  pull_request:
    branches: [dev, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Rust (stable, wasm32)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Linux packages (WebKitGTK 4.1 for the desktop app, Xvfb)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libsqlite3-dev xvfb xauth

      - name: The wasm-bindgen version components/ui-web pins
        id: pins
        run: |
          v=$(awk -F'"' '/^wasm-bindgen = /{print $2}' components/ui-web/crates/reva-ui-web/Cargo.toml | tr -d '=')
          echo "wasm_bindgen=$v" >> "$GITHUB_OUTPUT"

      - name: just, cargo-deny, wasm-bindgen
        uses: taiki-e/install-action@v2
        with:
          tool: just,cargo-deny,wasm-bindgen@${{ steps.pins.outputs.wasm_bindgen }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"
          cache-all-crates: true

      # before the tools: reg-rs links SQLite too
      - name: SQLite (Windows, the official sqlite3.dll; scripts/sqlite-dll.sh)
        if: runner.os == 'Windows'
        run: |
          scripts/sqlite-dll.sh x64
          dir=$(cygpath -w "$PWD/target/sqlite")
          echo "SQLITE3_LIB_DIR=$dir" >> "$GITHUB_ENV"
          echo "$dir" >> "$GITHUB_PATH"

      # the line-editing golden drives reva at a ConPTY (scripts/pty-lineedit.py)
      - name: pywinpty (Windows)
        if: runner.os == 'Windows'
        run: python3 -m pip install pywinpty

      - name: The softwarewrighter tools' commits (the cache key)
        id: swheads
        run: |
          key=$(for repo in sw-cli-tools/reg-rs sw-cli-tools/sed-rs softwarewrighter/sw-checklist; do
            git ls-remote "https://github.com/$repo" HEAD | cut -c1-12
          done | tr '\n' '-')
          echo "key=$key" >> "$GITHUB_OUTPUT"

      - name: Cache the softwarewrighter tools
        id: swcache
        uses: actions/cache@v4
        with:
          path: ~/sw-tools
          key: sw-tools-v2-${{ runner.os }}-${{ steps.swheads.outputs.key }}

      # From each tool's main, --locked: all three build on every OS
      # (reg-rs since its #1; docs/reg-rs-asks.md).
      - name: reg-rs, sed-rs, sw-checklist
        if: steps.swcache.outputs.cache-hit != 'true'
        run: |
          for repo in sw-cli-tools/reg-rs sw-cli-tools/sed-rs softwarewrighter/sw-checklist; do
            cargo install --locked --root "$HOME/sw-tools" --git "https://github.com/$repo"
          done

      - name: Tools on PATH
        run: |
          echo "$HOME/sw-tools/bin" >> "$GITHUB_PATH"

      - name: The gate (scripts/check.sh)
        run: |
          if [[ "$RUNNER_OS" == Linux ]]; then
            xvfb-run -a scripts/check.sh
          else
            scripts/check.sh
          fi

      # also after a failed gate (Windows' goldens), so the app is still tried
      - name: Desktop smoke test (components/desktop/smoke.sh)
        if: ${{ !cancelled() }}
        run: components/desktop/smoke.sh

      # the demo package's installer (scripts/make-installer.sh), installed
      # and run (scripts/installer-check.sh)
      - name: Installer (tests/installer-demo)
        if: ${{ !cancelled() }}
        run: |
          cargo install tauri-cli --version '^2' --locked
          scripts/make-installer.sh --native tests/installer-demo
          case "$RUNNER_OS" in
            Linux)
              sudo apt-get install -y ./target/installer/*.deb
              scripts/installer-check.sh /usr/bin/reva-demo ;;
            macOS)
              scripts/installer-check.sh "target/release/bundle/macos/Reva Demo.app/Contents/MacOS/reva-demo" ;;
            Windows)
              # NSIS, per user: /S is silent, no admin rights asked
              ./target/installer/*-setup.exe //S
              scripts/installer-check.sh "$LOCALAPPDATA/Reva Demo/reva-demo.exe" ;;
          esac

      - name: Upload the installers
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: target/installer/*.*
          if-no-files-found: ignore
