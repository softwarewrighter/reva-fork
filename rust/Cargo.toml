[workspace]
resolver = "2"
members = ["reva-vm", "reva-cli", "reva-web", "reva-serve"]

[workspace.package]
version = "2026.1026.0"
edition = "2024"
publish = false
license = "MIT"
authors = ["Reva development team"]
rust-version = "1.85"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.release.package.reva-web]
opt-level = "s"
