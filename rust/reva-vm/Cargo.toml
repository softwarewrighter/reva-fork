[package]
name = "reva-vm"
description = "Portable Reva Forth core: an IA-32-subset virtual machine plus the newcore routines in Rust"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
reva-x86 = { path = "../reva-x86" }
reva-host = { path = "../reva-host", default-features = false }
reva-core = { path = "../reva-core" }
reva-vlib = { path = "../reva-vlib" }
reva-words = { path = "../reva-words" }

[features]
default = ["embed-lib"]
# Compile lib/ into the core so `needs` works without the files (browser).
embed-lib = ["reva-host/embed-lib"]
