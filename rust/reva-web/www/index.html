<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reva Forth</title>
<style>
  :root { --bg:#fbfaf7; --fg:#1d1d1b; --muted:#6b6a65; --accent:#1f6f5c; --line:#dcd9d0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151513; --fg:#e8e6df; --muted:#9a988f; --accent:#6fc2a9; --line:#34332f; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:15px/1.45 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  main { max-width: 900px; margin: 0 auto; padding: 16px; display:flex; flex-direction:column; height:100vh; }
  header { color: var(--muted); padding-bottom: 8px; border-bottom: 1px solid var(--line); }
  header b { color: var(--accent); }
  #out { flex:1; overflow:auto; white-space:pre-wrap; word-break:break-word; margin:8px 0; }
  form { display:flex; gap:8px; border-top:1px solid var(--line); padding-top:8px; }
  #line { flex:1; font:inherit; color:inherit; background:transparent; border:0; outline:none; }
  .echo { color: var(--muted); }
  button { font:inherit; color:inherit; background:transparent; border:1px solid var(--line);
           border-radius:4px; padding:0 10px; cursor:pointer; }
  button:disabled { opacity:.4; cursor:default; }
</style>
</head>
<body>
<main>
  <header><b>Reva Forth</b> — portable vx86 core in WebAssembly. Try <code>: sq dup * ; 7 sq .</code></header>
  <div id="out" aria-live="polite"></div>
  <form id="f"><span>ok&gt;</span><input id="line" autocomplete="off" spellcheck="false" autofocus>
    <button type="button" id="stop" title="Stop the running word (Ctrl-C)" disabled>Stop</button></form>
</main>
<script type="module">
  // The VM runs in a Web Worker (see reva.js `start`), so this page only
  // draws: output is appended at most once per animation frame, and the
  // console keeps its last MAX_CHUNKS pieces so a chatty program cannot
  // grow the page without bound.
  import { start, RUNNING, HALTED } from "./reva.js";
  import { hostSetup } from "./host.js";
  const MAX_CHUNKS = 4000;
  const out = document.getElementById("out");
  const line = document.getElementById("line");
  const stop = document.getElementById("stop");
  let pending = "", frame = 0;
  const append = (s, cls) => {
    const span = document.createElement("span");
    if (cls) span.className = cls;
    span.textContent = s;
    out.append(span);
    while (out.childElementCount > MAX_CHUNKS) out.firstElementChild.remove();
    out.scrollTop = out.scrollHeight;
    return span;
  };
  const flush = () => { frame = 0; if (pending) append(pending); pending = ""; };
  const write = (s) => { pending += s; frame ||= requestAnimationFrame(flush); };
  const echo = (s) => { flush(); append(s, "echo"); };

  // The host (host.js) says where files are kept (the browser: in
  // localStorage; the desktop app: in a folder) and what to feed at start.
  // reva.status starts as RUNNING (booting); onStatus reports each change.
  // ?image=app.img starts from a saved image instead of booting reva.f.
  const host = await hostSetup();
  if (host.title) {
    document.title = host.title;
    document.querySelector("header b").textContent = host.title;
  }
  const image = new URLSearchParams(location.search).get("image") ?? undefined;
  const reva = start("reva.wasm", {
    image,
    storage: host.storage,
    onOutput: (s) => { write(s); host.output?.(s); },
    onStatus: (s) => {
      stop.disabled = s !== RUNNING;
      if (s === HALTED) {
        echo(`\n[exited with status ${reva.exitCode}]\n`);
        line.disabled = true;
        host.halted?.(reva.exitCode);
      }
    },
  });
  const starting = append("starting...\n", "echo");
  for (const n of host.notes ?? []) append(`note: ${n}\n`, "echo");
  await reva.ready;
  starting.remove();
  // Start lines (a package's start files) are read again after `restart`;
  // input lines only once.
  for (const text of host.start ?? []) {
    echo(text + "\n");
    reva.feedStart(text + "\n");
  }
  for (const text of host.input ?? []) {
    echo(text + "\n");
    reva.feed(text + "\n");
  }

  document.getElementById("f").addEventListener("submit", (e) => {
    e.preventDefault();
    const text = line.value;
    line.value = "";
    echo(text + "\n");
    reva.feed(text + "\n");
  });
  stop.addEventListener("click", () => reva.stop());
  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.key === "c" && !window.getSelection()?.toString()) {
      e.preventDefault();
      reva.stop();
    }
  });
</script>
</body>
</html>
