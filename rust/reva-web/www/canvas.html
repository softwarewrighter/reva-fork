<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reva graphics</title>
<link rel="icon" href="favicon.png">
<style>
  :root { --bg:#fbfaf7; --fg:#1d1d1b; --muted:#6b6a65; --line:#dcd9d0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151513; --fg:#e8e6df; --muted:#9a988f; --line:#34332f; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin:0; background:var(--bg); color:var(--fg); display:flex; flex-direction:column;
         font:13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  header { display:flex; gap:12px; align-items:center; padding:6px 10px; border-bottom:1px solid var(--line); color:var(--muted); }
  header b { color: var(--fg); font-weight: 600; }
  header .grow { flex: 1; }
  button { font:inherit; color:inherit; background:transparent; border:1px solid var(--line);
           border-radius:4px; padding:1px 10px; cursor:pointer; }
  #stage { flex:1; position:relative; min-height:0; }
  /* Two stacked canvases: the drawing (kept), the turtle (redrawn). */
  canvas { position:absolute; inset:0; margin:auto; max-width:100%; max-height:100%;
           aspect-ratio:1; width:100%; height:auto; }
  @media (min-aspect-ratio: 1/1) { canvas { width:auto; height:100%; } }
</style>
</head>
<body>
<header><b>Reva graphics</b><span id="info">waiting for the turtle…</span><span class="grow"></span>
  <button id="png" type="button" title="Save the drawing as a PNG image">Save PNG</button></header>
<div id="stage"><canvas id="draw"></canvas><canvas id="turtle"></canvas></div>
<script type="module">
  // The graphics window: draws the op stream of the VM's display list
  // (rust/reva-vm/src/canvas.rs) sent by the REPL page (ui.js).
  //
  // Records are 8 floats: CLEAR(1) bg | LINE(2) x1 y1 x2 y2 rgb width |
  // TURTLE(3) x y heading visible.  World: 800x800, origin in the centre,
  // y up.  Lines are queued and drawn on animation frames, at most
  // FRAME_LINES per frame, so the window stays responsive while a big
  // drawing streams in.
  //
  // Resolution follows the window: the backing store is the displayed size
  // times devicePixelRatio (MIN_PX..MAX_PX).  When the window or pane
  // changes size (ResizeObserver, settled for RESIZE_MS) the canvas is
  // resized, which clears it, and the page is asked to "redraw": the VM
  // sends the whole drawing again.  The page keeps no copy (see ui.js), so
  // memory stays bounded however big the drawing.
  const WORLD = 800, MIN_PX = 256, MAX_PX = 4096, RESIZE_MS = 120, FRAME_LINES = 60000, REC = 8;
  const CLEAR = 1, LINE = 2, TURTLE = 3;
  const draw = document.getElementById("draw"), turtle = document.getElementById("turtle");
  const stage = document.getElementById("stage");
  const g = draw.getContext("2d"), tg = turtle.getContext("2d");
  let scale = 2; // backing pixels per world unit
  const world = (ctx) => ctx.setTransform(scale, 0, 0, -scale, (WORLD * scale) / 2, (WORLD * scale) / 2);
  /** Size the backing store to the stage; true if it changed (and so was cleared). */
  function fit() {
    const r = stage.getBoundingClientRect();
    const css = Math.min(r.width, r.height);
    if (css < 8) return false; // hidden (a collapsed pane): keep what is there
    const px = Math.round(Math.min(MAX_PX, Math.max(MIN_PX, css * (globalThis.devicePixelRatio || 1))));
    if (px === draw.width) return false;
    for (const c of [draw, turtle]) c.width = c.height = px;
    scale = px / WORLD;
    world(g);
    world(tg);
    return true;
  }
  if (!fit()) { for (const c of [draw, turtle]) c.width = c.height = WORLD * scale; world(g); world(tg); }
  const info = document.getElementById("info");
  const hex = (rgb) => "#" + (rgb | 0).toString(16).padStart(6, "0");

  let queue = [], qi = 0, at = 0, lines = 0, frame = 0, sprite = null, background = 0xfbfaf7;

  function clear(bg) {
    queue = []; qi = 0; at = 0; lines = 0; background = bg;
    g.save();
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.fillStyle = hex(bg);
    g.fillRect(0, 0, draw.width, draw.height);
    g.restore();
  }
  clear(0xfbfaf7);

  function receive(ops) {
    // a batch that starts a new drawing drops what is still queued
    if (ops.length && ops[0] === CLEAR) clear(ops[1]);
    queue.push(ops);
    frame ||= requestAnimationFrame(render);
  }

  function render() {
    frame = 0;
    let budget = FRAME_LINES, style = "", width = -1, open = false;
    const flush = () => { if (open) g.stroke(); open = false; };
    while (qi < queue.length && budget > 0) {
      const ops = queue[qi];
      for (; at < ops.length && budget > 0; at += REC) {
        const op = ops[at];
        if (op === LINE) {
          const s = hex(ops[at + 5]), w = Math.max(ops[at + 6], 1 / scale);
          if (s !== style || w !== width) {
            flush();
            g.strokeStyle = style = s;
            g.lineWidth = width = w;
            g.lineCap = g.lineJoin = "round";
          }
          if (!open) { g.beginPath(); open = true; }
          g.moveTo(ops[at + 1], ops[at + 2]);
          g.lineTo(ops[at + 3], ops[at + 4]);
          lines++;
          budget--;
        } else if (op === TURTLE) {
          sprite = ops[at + 4] ? [ops[at + 1], ops[at + 2], ops[at + 3]] : null;
        }
      }
      if (at >= ops.length) { qi++; at = 0; }
    }
    flush();
    if (qi >= queue.length) { queue = []; qi = 0; }
    else frame = requestAnimationFrame(render);
    drawTurtle();
    info.textContent = `${lines.toLocaleString()} lines`;
    send({ type: "drawn", lines });
  }

  function drawTurtle() {
    tg.save();
    tg.setTransform(1, 0, 0, 1, 0, 0);
    tg.clearRect(0, 0, turtle.width, turtle.height);
    tg.restore();
    if (!sprite) return;
    const [x, y, h] = sprite;
    tg.save();
    tg.translate(x, y);
    tg.rotate((-h * Math.PI) / 180); // heading: clockwise from north
    tg.beginPath();
    tg.moveTo(0, 9); tg.lineTo(5, -5); tg.lineTo(0, -2); tg.lineTo(-5, -5); tg.closePath();
    tg.fillStyle = "rgba(192, 57, 43, 0.85)";
    tg.fill();
    tg.restore();
  }

  document.getElementById("png").addEventListener("click", () => {
    draw.toBlob((blob) => {
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "reva-drawing.png";
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
  });

  // Transport: postMessage to the page that holds this pane (browser and
  // desktop alike) or opened this popup; Tauri events in a native window.
  const pane = new URLSearchParams(location.search).has("pane");
  const tauri = pane ? null : globalThis.__TAURI__;
  const send = tauri
    ? (m) => tauri.event.emitTo("main", "reva-ui-up", { ...m, window: "canvas" })
    : (m) => (window.opener ?? window.parent)?.postMessage({ ...m, window: "canvas" }, "*");
  const onMessage = (m) => {
    if (m?.type === "ops") receive(m.ops instanceof Float32Array ? m.ops : Float32Array.from(m.ops));
    else if (m?.type === "reset") { clear(0xfbfaf7); sprite = null; drawTurtle(); info.textContent = "restarted"; }
  };
  if (tauri) await tauri.event.listen("reva-ui-down", (e) => onMessage(e.payload));
  else addEventListener("message", (e) => onMessage(e.data));
  if (pane) document.body.classList.add("pane");
  send({ type: "ready" });
  // Redraw at the new size once a resize settles.
  let settle = 0;
  new ResizeObserver(() => {
    clearTimeout(settle);
    settle = setTimeout(() => {
      if (!fit()) return;
      clear(background);
      drawTurtle();
      send({ type: "redraw" });
    }, RESIZE_MS);
  }).observe(stage);
</script>
</body>
</html>
